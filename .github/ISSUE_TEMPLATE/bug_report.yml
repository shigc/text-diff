name: Bug 报告
description: 报告一个可复现的问题
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索是否已有同类 issue。

        **请勿粘贴真实敏感文本**（密钥、合同、日志原文），用最小可复现的示例代替。

  - type: input
    id: url
    attributes:
      label: 出现问题的地址
      description: 在线站点还是本地/自部署版本
      placeholder: https://diff.shigc.top/
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 在左侧输入 ...
        2. 勾选 ...
        3. 点击 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 如有报错，请贴出控制台信息
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器与操作系统
      placeholder: Chrome 131 / Windows 11
    validations:
      required: true

  - type: dropdown
    id: view
    attributes:
      label: 视图模式
      options:
        - 并排视图
        - 统一视图
        - 与视图无关
    validations:
      required: false
