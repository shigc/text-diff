name: 功能建议
description: 提出新功能或改进建议
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        请先确认该功能符合本项目的定位：**纯前端、无后端、不收集任何数据**。
        需要服务器或会引入用户追踪的方案通常不会被接受。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景，而不只是实现方式
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
